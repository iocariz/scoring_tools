name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

      # Note (todo #51): `uv lock --check` was briefly enabled here, but the
      # committed uv.lock is platform-resolved and a Linux-CI fresh resolution
      # yields a different package set (86 committed vs 144 on Linux). The
      # check would need either a multi-platform lockfile regeneration
      # (best done in a Linux runner / Docker container as a one-off) or a
      # switch to a universal lockfile format. Deferred to R2.

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e . pytest-cov

      - name: Run tests with coverage
        # --cov-fail-under=70 ratchets the R1 floor (60%) upward following the
        # R2 decomposition + targeted helper tests (R2b-viii, todo #58).
        # Baseline after R2b-viii was 70.12%. Do not lower without discussion.
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage.xml
          # Flip to true once the Codecov account is green on main to start
          # failing the build on upload issues rather than suppressing them.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: scoring-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t scoring-tools:test .
          docker run --rm scoring-tools:test uv run pytest tests/ -v --tb=short
