# Segment configurations for batch processing
# Each segment defines a segment_filter and optional overrides

# =============================================================================
# SUPERSEGMENTS
# =============================================================================
# A supersegment groups segments. There are two independent uses:
#
#   modelling_supersegment  — segments that share a trained inference model.
#                             The model is trained on combined data (Phase 1),
#                             then optimization runs individually per segment.
#   reporting_supersegment  — segments that are grouped together in the
#                             consolidated report / Excel dashboard.
#
# Each segment can reference different supersegments for modelling and
# reporting (or the same one for both). For backward compatibility, a plain
# `supersegment` field is treated as both modelling AND reporting.
#
# Per-segment resolution order:
#   modelling:  modelling_supersegment > supersegment > None (train own model)
#   reporting:  reporting_supersegment > supersegment > None (standalone)

[reporting_supersegments.known]
# List of segment_filter values that belong to this group
segment_filters = [
    "no_premium_ab",
    "no_premium_cd",
    "no_premium_ef",
    "premium",
    "precon"
]
# learn_own_bin_edges = true  # uncomment to learn bin edges from "known" population only

[reporting_supersegments.others]
segment_filters = [
    "new_fintonic",
    "new_no_fintonic",
    "open_banking",
    "conso_no_premium",
    "conso_premium"
]
learn_own_bin_edges = true  # learn bin edges from "others" population instead of global

[modelling_supersegments.total]
segment_filters = [
    "no_premium_ab",
    "no_premium_cd",
    "no_premium_ef",
    "premium",
    "precon",
    "new_fintonic",
    "new_no_fintonic",
    "open_banking",
    "conso_no_premium",
    "conso_premium"
]


# =============================================================================
# SEGMENTS
# =============================================================================

[segments.no_premium_ab]
segment_filter = "no_premium_ab"
optimum_risk = 1.0
risk_step = 0.1
reporting_supersegment = "known"  # Grouped in "total" for reporting
modelling_supersegment = "total"
min_risk = 0.8  # Optional: minimum risk for global allocation
max_risk = 1.4  # Optional: maximum risk for global allocation

[segments.no_premium_cd]
segment_filter = "no_premium_cd"
optimum_risk = 1.28
risk_step = 0.1
reporting_supersegment = "known"  # Grouped in "total" for reporting
modelling_supersegment = "total"

[segments.no_premium_ef]
segment_filter = "no_premium_ef"
optimum_risk = 1.09
risk_step = 0.1
reporting_supersegment = "known"  # Grouped in "total" for reporting
modelling_supersegment = "total"

[segments.premium]
