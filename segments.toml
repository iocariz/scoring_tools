# Segment configurations for batch processing
# Each segment defines a segment_filter and optional overrides

# =============================================================================
# SUPERSEGMENTS
# =============================================================================
# A supersegment groups segments. There are two independent uses:
#
#   modelling_supersegment  — segments that share a trained inference model.
#                             The model is trained on combined data (Phase 1),
#                             then optimization runs individually per segment.
#   reporting_supersegment  — segments that are grouped together in the
#                             consolidated report / Excel dashboard.
#
# Each segment can reference different supersegments for modelling and
# reporting (or the same one for both). For backward compatibility, a plain
# `supersegment` field is treated as both modelling AND reporting.
#
# Per-segment resolution order:
#   modelling:  modelling_supersegment > supersegment > None (train own model)
#   reporting:  reporting_supersegment > supersegment > None (standalone)


[modelling_supersegments.direct]
segment_filters = [
    "direct/consolidation/known/nopremium/a-f",
    "direct/consolidation/known/premium",
    "direct/pl/known/nopremium/a-b",
    "direct/pl/known/nopremium/c-d",
    "direct/pl/known/nopremium/e-f",
    "direct/pl/known/precon",
    "direct/pl/new"
]

[reporting_supersegments.direct-pl-known-premium-precon]
segment_filters = ["direct/pl/known/precon"]
bin_edges.income_bin = [-inf, 2000.0, inf]

[reporting_supersegments.direct-consolidation]
segment_filters = ["direct/consolidation/known/nopremium/a-f", "direct/consolidation/known/premium","direct/consolidation/new"]
bin_edges.income_bin = [-inf, 2000.0, inf]

[segments.direct-conso-known-no-premium]
segment_filter = "direct/consolidation/known/nopremium/a-f"
optimum_risk = 0.8  # CHANGED (was 1.3)
risk_step = 0.1
reporting_supersegment = "direct-consolidation"
modelling_supersegment = "direct"
min_risk = 0.7  # Optional: minimum risk for global allocation
max_risk = 1.4  # Optional: maximum risk for global allocation


[segments.direct-conso-known-premium]
segment_filter = "direct/consolidation/known/premium"
reporting_supersegment = "direct-consolidation"
modelling_supersegment = "direct"
baseline_mode = true

[reporting_supersegments.direct-pl-new]
segment_filters = ["direct/pl/new"]
bin_edges.income_bin = [-inf, 2000.0, inf]

[segments.direct-pl-new]
segment_filter = "direct/pl/new"
optimum_risk = 1.2  # CHANGED (was 1.1)
risk_step = 0.1
reporting_supersegment = "direct-pl-new"
modelling_supersegment = "direct"
min_risk = 0.8  # Optional: minimum risk for global allocation
max_risk = 1.3  # Optional: maximum risk for global allocation

[reporting_supersegments.direct-pl-known-no-premium]
segment_filters = ["direct/pl/known/nopremium/a-b", "direct/pl/known/nopremium/c-d","direct/pl/known/nopremium/e-f"]
bin_edges.income_bin = [-inf, 2000.0, inf]

[segments.direct-known-no_premium-ab]
segment_filter = "direct/pl/known/nopremium/a-b"
optimum_risk = 1.1
risk_step = 0.1
reporting_supersegment = "direct-pl-known-no-premium"
modelling_supersegment = "direct"
min_risk = 0.8
max_risk = 1.4
cutoff_floor_segment = "direct-known-no_premium-cd"  # Must accept at least what cd accepts (least restrictive)

[segments.direct-known-no_premium-cd]
segment_filter = "direct/pl/known/nopremium/c-d"
optimum_risk = 1.4
risk_step = 0.1
reporting_supersegment = "direct-pl-known-no-premium"
modelling_supersegment = "direct"
min_risk = 0.8
max_risk = 1.6
cutoff_floor_segment = "direct-known-no_premium-ef"

[segments.direct-known-no_premium-ef]
segment_filter = "direct/pl/known/nopremium/e-f"
optimum_risk = 1.4  # CHANGED (was 1.09)
risk_step = 0.1
reporting_supersegment = "direct-pl-known-no-premium"
modelling_supersegment = "direct"
min_risk = 0.8
max_risk = 1.5

[segments.direct-pl-known-premium-precon]
segment_filter = "direct/pl/known/precon"
optimum_risk = 1.4
risk_step = 0.1
reporting_supersegment = "direct-pl-known-premium-precon"
modelling_supersegment = "direct"
min_risk = 0.8
max_risk = 1.4

# Add more segments as needed:
# [segments.another_segment]
# segment_filter = "your_segment_filter_value"
# optimum_risk = 1.0  # optional, defaults to config.toml value
# risk_step = 0.1  # optional override
# modelling_supersegment = "name"   # optional: share model with other segments
# reporting_supersegment = "name"   # optional: group in consolidated report
# supersegment = "name"             # legacy: sets both modelling + reporting

# =============================================================================
# FIXED CUTOFFS EXAMPLE
# =============================================================================
# Use fixed_cutoffs to skip optimization and apply predefined cutoff values.
# This is useful for:
# - Applying validated/approved cutoffs from a previous analysis
# - Testing specific cutoff configurations
# - Regulatory/compliance scenarios with mandated cutoffs
#
# Example configuration:
# [segments.segment_with_fixed_cutoffs]
# segment_filter = "your_segment_filter_value"
# optimum_risk = 1.1  # Still used for reporting, but not for optimization
#
# # Fixed cutoffs: for each var0 bin, specify the max var1 value to accept
# # The lists must have the same length (one cutoff per bin)
# [segments.segment_with_fixed_cutoffs.fixed_cutoffs]
# sc_octroi_new_clus = [1.0, 2.0, 3.0, 4.0]  # var0 bin values
# new_efx_clus = [2, 2, 3, 4]                 # var1 cutoff for each var0 bin
# strict_validation = false  # If true, raise errors instead of warnings for:
#                            #   - Bin mismatches between config and data
#                            #   - Non-monotonic cutoffs
#                            #   - Cutoffs outside data range
# run_all_scenarios = false  # If true, generate all scenarios (pessimistic/base/optimistic)
#                            # Default: only generate base scenario with fixed cutoffs
#
# This means:
#   - For sc_octroi_new_clus bin 1.0 -> accept new_efx_clus <= 2
#   - For sc_octroi_new_clus bin 2.0 -> accept new_efx_clus <= 2
#   - For sc_octroi_new_clus bin 3.0 -> accept new_efx_clus <= 3
#   - For sc_octroi_new_clus bin 4.0 -> accept new_efx_clus <= 4
#
# =============================================================================
# N>2 FIXED CUTOFFS — FLAT (PAIRED) EXAMPLE
# =============================================================================
# For 3+ variables with flat paired cutoffs: var0 lists bin values,
# secondary variables list a cutoff threshold per var0 bin (equal length).
#
# [segments.segment_with_3var_fixed_cutoffs]
# segment_filter = "your_segment"
# optimum_risk = 1.1
# variables = ['sc_octroi_new_clus', 'new_efx_clus', 'income_bin']
#
# [segments.segment_with_3var_fixed_cutoffs.fixed_cutoffs]
# sc_octroi_new_clus = [1.0, 2.0, 3.0, 4.0]   # var0 bin values
# new_efx_clus = [20, 20, 16, 1]               # cutoff per var0 bin
# income_bin = [2, 2, 2, 1]                     # cutoff per var0 bin
# strict_validation = false
# run_all_scenarios = false
#
# =============================================================================
# N>2 FIXED CUTOFFS — MATRIX EXAMPLE
# =============================================================================
# For different cutoff schedules depending on a conditioning variable's value.
# The conditioning variable is ABSENT from fixed_cutoffs; its accepted values
# are the dict keys. Each dict entry is a per-var0-bin cutoff schedule.
#
# [segments.segment_with_matrix_cutoffs]
# segment_filter = "your_segment"
# optimum_risk = 1.1
# variables = ['sc_octroi_new_clus', 'new_efx_clus', 'income_bin']
#
# [segments.segment_with_matrix_cutoffs.fixed_cutoffs]
# sc_octroi_new_clus = [1.0, 2.0, 3.0, 4.0]   # var0 bin values
#
# # new_efx_clus cutoffs vary by income_bin value (conditioning variable):
# [segments.segment_with_matrix_cutoffs.fixed_cutoffs.new_efx_clus]
# 1 = [20, 20, 16, 1]    # when income_bin = 1
# 2 = [20, 16, 11, 1]    # when income_bin = 2
# strict_validation = false
# run_all_scenarios = false