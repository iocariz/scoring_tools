# Add more segments as needed:
# [segments.another_segment]
# segment_filter = "your_segment_filter_value"
# optimum_risk = 1.0  # optional, defaults to config.toml value
# risk_step = 0.1  # optional override
# modelling_supersegment = "name"   # optional: share model with other segments
# reporting_supersegment = "name"   # optional: group in consolidated report
# supersegment = "name"             # legacy: sets both modelling + reporting

# =============================================================================
# FIXED CUTOFFS EXAMPLE
# =============================================================================
# Use fixed_cutoffs to skip optimization and apply predefined cutoff values.
# This is useful for:
# - Applying validated/approved cutoffs from a previous analysis
# - Testing specific cutoff configurations
# - Regulatory/compliance scenarios with mandated cutoffs
#
# Example configuration:
# [segments.segment_with_fixed_cutoffs]
# segment_filter = "your_segment_filter_value"
# optimum_risk = 1.1  # Still used for reporting, but not for optimization
#
# # Fixed cutoffs: for each var0 bin, specify the max var1 value to accept
# # The lists must have the same length (one cutoff per bin)
# [segments.segment_with_fixed_cutoffs.fixed_cutoffs]
# sc_octroi_new_clus = [1.0, 2.0, 3.0, 4.0]  # var0 bin values
# new_efx_clus = [2, 2, 3, 4]                 # var1 cutoff for each var0 bin
# strict_validation = false  # If true, raise errors instead of warnings for:
#                            #   - Bin mismatches between config and data
#                            #   - Non-monotonic cutoffs
#                            #   - Cutoffs outside data range
# run_all_scenarios = false  # If true, generate all scenarios (pessimistic/base/optimistic)
#                            # Default: only generate base scenario with fixed cutoffs
#
# This means:
#   - For sc_octroi_new_clus bin 1.0 -> accept new_efx_clus <= 2
#   - For sc_octroi_new_clus bin 2.0 -> accept new_efx_clus <= 2
#   - For sc_octroi_new_clus bin 3.0 -> accept new_efx_clus <= 3
#   - For sc_octroi_new_clus bin 4.0 -> accept new_efx_clus <= 4
#
# =============================================================================
# N>2 FIXED CUTOFFS — FLAT (PAIRED) EXAMPLE
# =============================================================================
# For 3+ variables with flat paired cutoffs: var0 lists bin values,
# secondary variables list a cutoff threshold per var0 bin (equal length).
#
# [segments.segment_with_3var_fixed_cutoffs]
# segment_filter = "your_segment"
# optimum_risk = 1.1
# variables = ['sc_octroi_new_clus', 'new_efx_clus', 'income_bin']
#
# [segments.segment_with_3var_fixed_cutoffs.fixed_cutoffs]
# sc_octroi_new_clus = [1.0, 2.0, 3.0, 4.0]   # var0 bin values
# new_efx_clus = [20, 20, 16, 1]               # cutoff per var0 bin
# income_bin = [2, 2, 2, 1]                     # cutoff per var0 bin
# strict_validation = false
# run_all_scenarios = false
#
# =============================================================================
# N>2 FIXED CUTOFFS — MATRIX EXAMPLE
# =============================================================================
# For different cutoff schedules depending on a conditioning variable's value.
# The conditioning variable is ABSENT from fixed_cutoffs; its accepted values
# are the dict keys. Each dict entry is a per-var0-bin cutoff schedule.
#
# [segments.segment_with_matrix_cutoffs]
# segment_filter = "your_segment"
# optimum_risk = 1.1
# variables = ['sc_octroi_new_clus', 'new_efx_clus', 'income_bin']
#
# [segments.segment_with_matrix_cutoffs.fixed_cutoffs]
# sc_octroi_new_clus = [1.0, 2.0, 3.0, 4.0]   # var0 bin values
#
# # new_efx_clus cutoffs vary by income_bin value (conditioning variable):
# [segments.segment_with_matrix_cutoffs.fixed_cutoffs.new_efx_clus]
# 1 = [20, 20, 16, 1]    # when income_bin = 1
# 2 = [20, 16, 11, 1]    # when income_bin = 2
# strict_validation = false
# run_all_scenarios = false
